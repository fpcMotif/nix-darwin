# Machine defaults live here. Codex persists model and reasoning choices in
# writable ~/.codex/config.toml, which has higher precedence than this layer.
plan_mode_reasoning_effort = "xhigh"
personality = "none"
approvals_reviewer = "user"
suppress_unstable_features_warning = true
check_for_update_on_startup = false
service_tier = "default"
notify = ["/Users/martinfan/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
approval_policy = "never"
sandbox_mode = "danger-full-access"
# Command allow/refuse lists live in ~/.codex/rules/default.rules (execpolicy
# prefix_rule files — the official mechanism; config.toml has no allow/deny keys).
# They mirror ~/.claude/settings.json permissions.allow/deny. decision="forbidden"
# still hard-blocks under approval_policy="never"; decision="prompt" fails closed.
# Validate: codex execpolicy check --pretty --rules ~/.codex/rules/default.rules -- <cmd>

[agents]
max_depth = 2
# malab-disabled(incompatible with multi_agent_v2): max_threads = 6

[sandbox_workspace_write]
network_access = true

# CLI profiles live in <name>.config.toml beside this file.

[features]
apps = false
child_agents_md = true
chronicle = true
external_migration = true
goals = true
guardian_approval = true
hooks = true
memories = true
multi_agent = true
prevent_idle_sleep = true
respect_system_proxy = true
terminal_resize_reflow = true
network_proxy = false
mentions_v2 = true
js_repl = false
# Experimental context management (new compaction): notes + searchable
