# Build the CI-covered flake configurations on real macOS / Linux runners.
#
# `fpcMotif/dotfiles` is public, so the `dotfiles` flake input uses the
# `github:` URL form and the workflow needs no SSH key. If the dotfiles repo
# is ever made private, switch the input back to `git+ssh://...` and add a
# `webfactory/ssh-agent` step that consumes a Deploy Key stored as the
# `DOTFILES_DEPLOY_KEY` Actions secret.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: checks (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # The check names come from the flake, so a check added to
      # tests/default.nix runs here with no edit to this file.
      - name: Build every checks.x86_64-linux
        run: |
          checks=$(nix eval --raw '.#checks.x86_64-linux' --apply 'cs: toString (builtins.attrNames cs)')
          echo "checks: $checks"
          nix build --no-link --show-trace --print-build-logs \
            $(printf '.#checks.x86_64-linux.%s ' $checks)

      - name: Build dev shell and dev container (x86_64-linux)
        run: |
          nix build --no-link --show-trace \
            '.#devShells.x86_64-linux.default' \
            '.#packages.x86_64-linux.dev-container'

  darwin:
    name: f (aarch64-darwin)
    runs-on: macos-14
    needs: flake-check
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build every checks.aarch64-darwin
        run: |
          checks=$(nix eval --raw '.#checks.aarch64-darwin' --apply 'cs: toString (builtins.attrNames cs)')
          echo "checks: $checks"
          nix build --no-link --show-trace --print-build-logs \
            $(printf '.#checks.aarch64-darwin.%s ' $checks)

      - name: Build dev shell (aarch64-darwin)
        run: |
          nix build --no-link --show-trace \
            '.#devShells.aarch64-darwin.default'

      - name: Guard — no source builds outside vendored derivations
        # Issue #336. Runs BEFORE the full system build so a nixpkgs revision
        # without darwin cache coverage fails in seconds, not after a half-hour
        # macOS compile. Hard failure: the nightly PR's auto-merge cannot fire
        # past a red required check. Also runnable locally against a
        # hand-edited lock:
        #   bash scripts/lib/auto-update.sh guard-source-builds
        run: |
          bash scripts/lib/auto-update.sh guard-source-builds \
            .#darwinConfigurations.f.system

      - name: Build darwinConfigurations.f
        run: |
          nix build \
            .#darwinConfigurations.f.system \
            --no-link --print-out-paths --show-trace

  nixos:
    name: ${{ matrix.config }} (x86_64-linux)
    runs-on: ubuntu-latest
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        config: [x230]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build nixosConfigurations.${{ matrix.config }}
        run: |
          nix build \
            .#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel \
            --no-link --print-out-paths --show-trace

  nixos-aarch64:
    name: vm-aarch64-utm (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    needs: flake-check
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build nixosConfigurations.vm-aarch64-utm
        run: |
          nix build \
            .#nixosConfigurations.vm-aarch64-utm.config.system.build.toplevel \
            --no-link --print-out-paths --show-trace

      - name: Build dev container (aarch64-linux)
        run: |
          nix build --no-link --show-trace \
            '.#packages.aarch64-linux.dev-container'
